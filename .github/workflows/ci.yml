name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          DATABASE_URL: file:./dev.db
          NEXTAUTH_SECRET: ci-secret-ci-secret-ci-secret-1234
          NEXTAUTH_URL: http://localhost:3000
          STORAGE_SECRET: ci-storage-secret
